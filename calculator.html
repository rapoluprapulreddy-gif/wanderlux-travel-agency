<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Cost Calculator - WanderLux</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">WanderLux</div>
      <button class="nav-toggle" aria-label="Toggle Navigation Menu">&#9776;</button>
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="calculator.html" class="active" aria-current="page">Trip Calculator</a></li>
        <li><a href="appointment.html">Appointment</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="content-section">
    <h1>Trip Cost Calculator</h1>
    <p>Calculate your estimated travel costs based on length, group size, and package type.</p>

    <!-- Interactive calculator form -->
    <div class="calculator-container" style="max-width: 600px; margin-top: 20px;">
      <form id="tripForm" class="calc-form">
        
        <div class="form-group">
          <label for="destination">Destination:</label>
          <!-- Daily rate stored in data-rate attribute for JavaScript extraction -->
          <select id="destination" name="destination" required>
            <option value="" disabled selected>Select a destination</option>
            <option value="Bali" data-rate="180">Bali ($180/day/person)</option>
            <option value="Paris" data-rate="320">Paris ($320/day/person)</option>
            <option value="Swiss Alps" data-rate="400">Swiss Alps ($400/day/person)</option>
            <option value="Tokyo" data-rate="280">Tokyo ($280/day/person)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="travellers">Number of Travellers:</label>
          <input type="number" id="travellers" name="travellers" min="1" max="20" value="2" required>
        </div>

        <div class="form-group">
          <label for="days">Number of Days:</label>
          <input type="number" id="days" name="days" min="1" max="60" value="5" required>
        </div>

        <div class="form-group">
          <label for="style">Travel Style:</label>
          <!-- Multiplier values passed into calculation formula -->
          <select id="style" name="style" required>
            <option value="0.8">Budget Package</option>
            <option value="1.0" selected>Standard Travel Package</option>
            <option value="1.6">Luxury Package</option>
          </select>
        </div>

        <button type="submit" class="btn">Calculate Cost</button>
      </form>

      <!-- Dynamic calculation output box (hidden by default) -->
      <div id="calcResult" class="result-box" style="display: none;">
        <h2>Estimated Quote</h2>
        <p id="resultText"></p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 WanderLux Travel Agency. All rights reserved.</p>
  </footer>

  <!-- Include global script and calculator engine script -->
  <script src="js/main.js"></script>
  <script src="js/calculator.js"></script>
</body>
</html>
